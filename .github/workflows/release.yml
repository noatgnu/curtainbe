name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build-appliance-images.yml
    with:
      image_type: both
      backend_ref: ${{ github.ref_name }}
      curtain_ref: master
      curtainptm_ref: master

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: curtain-*
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Curtain Appliance $TAG" \
            --notes "## Curtain Appliance $TAG

          | Image | Target |
          |-------|--------|
          | \`curtain-vm-amd64.qcow2.xz\` | VM — QEMU / VirtualBox / Proxmox |
          | \`curtain-x86-amd64.img.xz\` | Flashable x86 — USB / SSD |
          | \`curtain-pi-arm64.img.xz\` | Raspberry Pi 3B / 4 / 5 |
          | \`curtain-pi-lite-arm64.img.xz\` | Raspberry Pi Zero 2 W / 3 A+ (512 MB RAM) |" \
            artifacts/curtain-vm-amd64/*.qcow2.xz \
            artifacts/curtain-x86-amd64/*.img.xz \
            artifacts/curtain-pi-arm64/*.img.xz \
            artifacts/curtain-pi-lite-arm64/*.img.xz
