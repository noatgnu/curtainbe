name: Build Appliance Images

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Image type'
        type: choice
        default: 'both'
        options: [vm, rpi, both]
      backend_ref:
        description: 'Backend branch/tag (curtainbe)'
        type: string
        default: 'master'
      curtain_ref:
        description: 'Curtain frontend branch/tag'
        type: string
        default: 'master'
      curtainptm_ref:
        description: 'CurtainPTM frontend branch/tag'
        type: string
        default: 'master'

jobs:
  build-frontend:
    name: Pre-build Frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build curtain frontend
        env:
          CURTAIN_REF: ${{ inputs.curtain_ref || 'master' }}
        run: |
          git clone --depth 1 --branch "$CURTAIN_REF" https://github.com/noatgnu/curtain.git /tmp/curtain
          cd /tmp/curtain
          npm install
          npx ng build CurtainTwo --configuration=appliance --base-href /
          mkdir -p "$GITHUB_WORKSPACE/frontend/curtain"
          cp -r dist/browser/* "$GITHUB_WORKSPACE/frontend/curtain/"

      - name: Build curtainPTM frontend
        env:
          CURTAINPTM_REF: ${{ inputs.curtainptm_ref || 'master' }}
        run: |
          git clone --depth 1 --branch "$CURTAINPTM_REF" https://github.com/noatgnu/curtainPTM.git /tmp/curtainptm
          cd /tmp/curtainptm
          npm install
          npx ng build curtainPTM2 --configuration=appliance --base-href /
          mkdir -p "$GITHUB_WORKSPACE/frontend/curtainptm"
          cp -r dist/browser/* "$GITHUB_WORKSPACE/frontend/curtainptm/"

      - name: Upload curtain frontend
        uses: actions/upload-artifact@v4
        with:
          name: curtain-frontend
          path: frontend/curtain/
          retention-days: 1

      - name: Upload curtainPTM frontend
        uses: actions/upload-artifact@v4
        with:
          name: curtainptm-frontend
          path: frontend/curtainptm/
          retention-days: 1

  build-vm:
    name: VM Image (amd64)
    if: inputs.image_type != 'rpi'
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download curtain frontend
        uses: actions/download-artifact@v4
        with:
          name: curtain-frontend
          path: frontend/curtain

      - name: Download curtainPTM frontend
        uses: actions/download-artifact@v4
        with:
          name: curtainptm-frontend
          path: frontend/curtainptm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils cloud-image-utils genisoimage wget openssh-client \
            iproute2 avahi-daemon avahi-utils libnss-mdns

      - name: Fix /dev/kvm permissions
        run: sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: Setup test bridge network
        run: |
          sudo ip link add br0 type bridge stp_state 0 forward_delay 0
          sudo ip link set br0 promisc on
          sudo ip link set br0 type bridge mcast_snooping 0
          sudo ip link set br0 up
          sudo ip addr add 10.0.5.1/24 dev br0
          sudo ip tuntap add dev curtain-tap mode tap
          sudo ip link set curtain-tap master br0
          sudo ip link set curtain-tap promisc on
          sudo ip link set curtain-tap up
          sudo systemctl restart avahi-daemon
          sudo sed -i 's/^hosts:.*/hosts: files mdns4_minimal [NOTFOUND=return] dns/' /etc/nsswitch.conf

      - name: Generate SSH key
        run: |
          ssh-keygen -t ed25519 -f curtkey -N '' -q
          echo "SSH_PUBKEY=$(cat curtkey.pub)" >> $GITHUB_ENV

      - name: Download Ubuntu cloud image
        run: |
          wget -q "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img" -O vm-disk.qcow2
          qemu-img resize vm-disk.qcow2 20G

      - name: Create cloud-init seed
        run: |
          cat > ci-user-data << CIEOF
          #cloud-config
          users:
            - name: curtain
              groups: sudo
              shell: /bin/bash
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              ssh_authorized_keys:
                - ${SSH_PUBKEY}
          CIEOF
          printf 'instance-id: curtain-appliance\nlocal-hostname: curtain\n' > ci-meta-data
          cloud-localds seed.iso ci-user-data ci-meta-data

      - name: Boot VM and wait for SSH
        timeout-minutes: 10
        run: |
          qemu-system-x86_64 \
            -m 4096 -smp 2 \
            -drive file=vm-disk.qcow2,format=qcow2,if=virtio \
            -drive file=seed.iso,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::8080-:80,hostfwd=tcp::8443-:443 \
            -device virtio-net-pci,netdev=net0 \
            -netdev tap,id=net1,ifname=curtain-tap,script=no,downscript=no \
            -device virtio-net-pci,netdev=net1 \
            -machine type=pc,accel=kvm -cpu host \
            -display none -serial file:serial.log &
          QEMU_PID=$!
          echo "QEMU_PID=$QEMU_PID" >> $GITHUB_ENV

          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=3 -i curtkey -p 2222 curtain@localhost 'echo OK' 2>/dev/null; then
              echo "SSH ready (${i}x5s)"
              exit 0
            fi
            sleep 5
          done
          echo "=== SSH never came up. Serial console output: ==="
          cat serial.log 2>/dev/null | tail -50
          kill $QEMU_PID 2>/dev/null || true
          exit 1

      - name: Configure bridge NIC on VM
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost << 'ENDSSH'
          NIC=$(ip -o link show | awk -F': ' '!/LOOPBACK/{print $2}' | while read iface; do
            [ "$iface" = lo ] && continue
            ip -4 addr show "$iface" 2>/dev/null | grep -q 'inet ' || echo "$iface"
          done | head -1)
          if [ -z "$NIC" ]; then echo "ERROR: bridge NIC not found"; ip link show; exit 1; fi
          sudo ip addr add 10.0.5.10/24 dev "$NIC"
          sudo ip link set "$NIC" up
          echo "Bridge NIC configured: $NIC -> 10.0.5.10"
          ENDSSH
          echo "10.0.5.10 curtain.local curtainptm.local" | sudo tee -a /etc/hosts

      - name: mDNS check
        run: |
          for i in $(seq 1 30); do
            C_IP=$(avahi-resolve --name curtain.local 2>/dev/null | awk '{print $2}')
            PTM_IP=$(getent hosts curtainptm.local 2>/dev/null | awk '{print $1}')
            if [ -n "$C_IP" ] && [ -n "$PTM_IP" ]; then
              echo "OK: curtain.local=$C_IP curtainptm.local=$PTM_IP"; exit 0
            fi
            sleep 2
          done
          echo "FAIL: curtain.local=${C_IP:-missing} curtainptm.local=${PTM_IP:-missing}"; exit 1

      - name: Copy frontends to VM
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "sudo mkdir -p /opt/curtain/curtain /opt/curtain/curtainptm"
          tar -C "$GITHUB_WORKSPACE/frontend/curtain"    -czf /tmp/curtain-fe.tar.gz .
          tar -C "$GITHUB_WORKSPACE/frontend/curtainptm" -czf /tmp/curtainptm-fe.tar.gz .
          scp -o StrictHostKeyChecking=no -i curtkey -P 2222 \
            /tmp/curtain-fe.tar.gz /tmp/curtainptm-fe.tar.gz curtain@localhost:/tmp/
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost "
            sudo tar -xzf /tmp/curtain-fe.tar.gz    -C /opt/curtain/curtain/ &&
            sudo tar -xzf /tmp/curtainptm-fe.tar.gz -C /opt/curtain/curtainptm/
          "

      - name: Copy appliance files to VM
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "mkdir -p /tmp/appliance/nginx /tmp/appliance/systemd /tmp/appliance/avahi"
          scp -o StrictHostKeyChecking=no -i curtkey -P 2222 \
            .github/appliance/provision.sh \
            .github/appliance/env.template \
            .github/appliance/curtain-ptm-mdns.py \
            .github/appliance/first-boot.sh \
            curtain@localhost:/tmp/appliance/
          scp -o StrictHostKeyChecking=no -i curtkey -P 2222 \
            .github/appliance/nginx/curtain-ssl.conf \
            .github/appliance/nginx/curtain-upstream.conf \
            .github/appliance/nginx/curtain.conf \
            .github/appliance/nginx/curtainptm.conf \
            curtain@localhost:/tmp/appliance/nginx/
          scp -o StrictHostKeyChecking=no -i curtkey -P 2222 \
            .github/appliance/systemd/curtain-firstboot.service \
            .github/appliance/systemd/curtain-backend.service \
            .github/appliance/systemd/curtain-rqworker.service \
            .github/appliance/systemd/curtain-ptm-mdns.service \
            curtain@localhost:/tmp/appliance/systemd/
          scp -o StrictHostKeyChecking=no -i curtkey -P 2222 \
            .github/appliance/avahi/curtain.service \
            curtain@localhost:/tmp/appliance/avahi/
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "chmod +x /tmp/appliance/provision.sh /tmp/appliance/first-boot.sh"

      - name: Provision VM
        timeout-minutes: 20
        env:
          BACKEND_REF: ${{ inputs.backend_ref || 'master' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "sudo BACKEND_REF=${BACKEND_REF} /tmp/appliance/provision.sh"

      - name: Start backend services
        timeout-minutes: 5
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "sudo systemctl start curtain-backend"
          for i in $(seq 1 30); do
            code=$(ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
              "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/" 2>/dev/null) || true
            if echo "$code" | grep -qE "^[234][0-9][0-9]$"; then
              echo "Backend ready after ${i}x5s"
              break
            fi
            sleep 5
          done
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "sudo systemctl start curtain-rqworker"

      - name: Smoke test
        timeout-minutes: 10
        run: |
          fail() { echo "FAIL: $*"; exit 1; }

          CURTAIN=$(curl -sfk https://curtain.local/) \
            || fail "curtain.local did not return 200"
          CURTAINPTM=$(curl -sfk https://curtainptm.local/) \
            || fail "curtainptm.local did not return 200"

          echo "$CURTAIN" | grep -q "<title>Curtain 2.0</title>" \
            || fail "curtain.local wrong title — got: $(echo "$CURTAIN" | grep -o '<title>[^<]*</title>')"
          echo "$CURTAINPTM" | grep -q "<title>CurtainPTM</title>" \
            || fail "curtainptm.local wrong title — got: $(echo "$CURTAINPTM" | grep -o '<title>[^<]*</title>')"

          API=$(curl -sk -o /dev/null -w "%{http_code}" https://curtain.local/api/)
          echo "$API" | grep -qE "^[234]" \
            || fail "API at curtain.local returned unexpected status $API"

          echo "PASS: curtain.local and curtainptm.local serve correct frontends, API responds"

      - name: Remove CI SSH key
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            "sudo rm -f /home/curtain/.ssh/authorized_keys"

      - name: Shutdown VM
        run: |
          ssh -o StrictHostKeyChecking=no -i curtkey -p 2222 curtain@localhost \
            'sudo shutdown -P now' 2>/dev/null || true
          for i in $(seq 1 60); do
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "QEMU exited after ${i}x3s"
              break
            fi
            sleep 3
          done
          kill $QEMU_PID 2>/dev/null || true
          sleep 2

      - name: Compact and compress
        run: |
          qemu-img convert -O qcow2 -c vm-disk.qcow2 curtain-vm-amd64.qcow2
          xz -3 curtain-vm-amd64.qcow2
          ls -lh curtain-vm-amd64.qcow2.xz

      - name: Upload VM image
        uses: actions/upload-artifact@v4
        with:
          name: curtain-vm-amd64
          path: curtain-vm-amd64.qcow2.xz
          retention-days: 7
          compression-level: 0

  build-rpi:
    name: RPi Image (arm64)
    if: inputs.image_type != 'vm'
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download curtain frontend
        uses: actions/download-artifact@v4
        with:
          name: curtain-frontend
          path: frontend/curtain

      - name: Download curtainPTM frontend
        uses: actions/download-artifact@v4
        with:
          name: curtainptm-frontend
          path: frontend/curtainptm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/python*
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coreutils quilt debootstrap zerofree zip dosfstools \
            libarchive-tools rsync xz-utils file git curl bc gpg pigz \
            qemu-user-static binfmt-support arch-test debian-archive-keyring

      - name: Enable ARM64 emulation
        run: |
          sudo modprobe binfmt_misc
          sudo update-binfmts --enable qemu-aarch64 || true
          /usr/bin/qemu-aarch64-static --version

      - name: Clone pi-gen
        run: git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git

      - name: Patch pi-gen for qemu-user-static compatibility
        run: |
          sed -i 's/qemu-arm:qemu-user-binfmt/qemu-arm-static:qemu-user-static/' pi-gen/depends
          sudo ln -sf /usr/bin/qemu-arm-static /usr/local/bin/qemu-arm

          cat >> pi-gen/stage0/prerun.sh << 'SCRIPT'
          mkdir -p "${ROOTFS_DIR}/usr/share/keyrings"
          cp /usr/share/keyrings/debian-archive-keyring.gpg \
            "${ROOTFS_DIR}/usr/share/keyrings/debian-archive-keyring.pgp"
          SCRIPT

      - name: Create curtain stage
        env:
          BACKEND_REF: ${{ inputs.backend_ref || 'master' }}
        run: |
          mkdir -p pi-gen/stage2a/00-install-curtain

          cat > pi-gen/stage2a/prerun.sh << 'EOF'
          #!/bin/bash -e
          if [ ! -d "${ROOTFS_DIR}" ]; then
            copy_previous
          fi
          EOF

          cat > pi-gen/stage2a/00-install-curtain/00-run.sh << 'EOF'
          #!/bin/bash -e
          echo "=== CURTAIN: copying frontend files ==="
          mkdir -p "${ROOTFS_DIR}/opt/curtain/curtain"
          mkdir -p "${ROOTFS_DIR}/opt/curtain/curtainptm"
          cp -rT "${GITHUB_WORKSPACE}/frontend/curtain"    "${ROOTFS_DIR}/opt/curtain/curtain"
          cp -rT "${GITHUB_WORKSPACE}/frontend/curtainptm" "${ROOTFS_DIR}/opt/curtain/curtainptm"

          CURTAIN_TITLE=$(grep -o '<title>[^<]*</title>' \
            "${ROOTFS_DIR}/opt/curtain/curtain/index.html" 2>/dev/null || echo "MISSING")
          CURTAINPTM_TITLE=$(grep -o '<title>[^<]*</title>' \
            "${ROOTFS_DIR}/opt/curtain/curtainptm/index.html" 2>/dev/null || echo "MISSING")
          echo "Curtain title: ${CURTAIN_TITLE}"
          echo "CurtainPTM title: ${CURTAINPTM_TITLE}"
          [ "${CURTAIN_TITLE}"    = "<title>Curtain 2.0</title>" ] || { echo "ERROR: curtain wrong title";    exit 1; }
          [ "${CURTAINPTM_TITLE}" = "<title>CurtainPTM</title>"  ] || { echo "ERROR: curtainptm wrong title"; exit 1; }

          echo "=== CURTAIN: cloning backend ==="
          git clone --depth 1 --branch CURTAIN_BACKEND_REF_PLACEHOLDER \
            https://github.com/noatgnu/curtainbe.git \
            "${ROOTFS_DIR}/opt/curtain/backend"

          echo "=== CURTAIN: copying appliance configs ==="
          mkdir -p "${ROOTFS_DIR}/tmp/appliance"
          cp -r "${GITHUB_WORKSPACE}/.github/appliance/." "${ROOTFS_DIR}/tmp/appliance/"
          echo "=== CURTAIN: 00-run.sh complete ==="
          EOF

          sed -i "s|CURTAIN_BACKEND_REF_PLACEHOLDER|${BACKEND_REF}|" \
            pi-gen/stage2a/00-install-curtain/00-run.sh

          cp .github/appliance/chroot.sh \
            pi-gen/stage2a/00-install-curtain/01-run-chroot.sh

          echo "IMG_SUFFIX=-curtain" > pi-gen/stage2a/EXPORT_IMAGE
          rm -f pi-gen/stage2/EXPORT_IMAGE
          chmod +x \
            pi-gen/stage2a/prerun.sh \
            pi-gen/stage2a/00-install-curtain/00-run.sh \
            pi-gen/stage2a/00-install-curtain/01-run-chroot.sh

          touch pi-gen/stage3/SKIP pi-gen/stage4/SKIP pi-gen/stage5/SKIP

          cat > pi-gen/config << 'CFGEOF'
          IMG_NAME=curtain-pi
          RELEASE=trixie
          DEPLOY_COMPRESSION=xz
          COMPRESSION_LEVEL=9
          LOCALE_DEFAULT=en_US.UTF-8
          TARGET_HOSTNAME=curtain
          KEYBOARD_KEYMAP=gb
          KEYBOARD_LAYOUT="English (UK)"
          TIMEZONE_DEFAULT=UTC
          FIRST_USER_NAME=curtain
          FIRST_USER_PASS=curtain123
          ENABLE_SSH=1
          STAGE_LIST="stage0 stage1 stage2 stage2a"
          BOOTSTRAP_KEYRING=debian-archive-keyring
          CFGEOF

      - name: Build RPi image
        timeout-minutes: 180
        run: |
          cd pi-gen
          export DEBOOTSTRAP_QEMU_USER_STATIC=/usr/bin/qemu-aarch64-static
          sudo -E USE_DOCKER=0 ./build.sh

      - name: Post-build RPi image test
        timeout-minutes: 45
        run: |
          ROOTFS=$(find pi-gen/work -name "rootfs" -path "*/stage2a/rootfs" | head -1)
          echo "Testing with ROOTFS at: ${ROOTFS}"
          fail() { echo "FAIL: $*"; exit 1; }

          sudo mount --bind /proc    "${ROOTFS}/proc"
          sudo mount --bind /sys     "${ROOTFS}/sys"
          sudo mount --bind /dev     "${ROOTFS}/dev"
          sudo mount --bind /dev/pts "${ROOTFS}/dev/pts"
          sudo mount -t tmpfs tmpfs  "${ROOTFS}/run"

          cleanup() {
            sudo chroot "${ROOTFS}" nginx -s stop 2>/dev/null || true
            sudo chroot "${ROOTFS}" bash -c '
              kill $(cat /tmp/gunicorn.pid 2>/dev/null) 2>/dev/null || true
              service redis-server stop 2>/dev/null || true
              service postgresql stop  2>/dev/null || true
            ' 2>/dev/null || true
            sudo umount "${ROOTFS}/run" \
              "${ROOTFS}/dev/pts" "${ROOTFS}/dev" \
              "${ROOTFS}/sys"     "${ROOTFS}/proc" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "=== Starting PostgreSQL ==="
          sudo chroot "${ROOTFS}" service postgresql start \
            || fail "PostgreSQL failed to start"

          echo "=== Starting Redis ==="
          sudo chroot "${ROOTFS}" service redis-server start \
            || fail "Redis failed to start"

          echo "=== Starting Django backend (ARM64 via QEMU) ==="
          sudo chroot "${ROOTFS}" bash -c '
            cd /opt/curtain/backend
            set -a; source /opt/curtain/.env; set +a
            /opt/curtain/venv/bin/gunicorn curtainbe.asgi:application \
              --bind 127.0.0.1:8000 \
              --workers 1 \
              --timeout 300 \
              -k uvicorn.workers.UvicornWorker \
              --daemon \
              --pid /tmp/gunicorn.pid
          '

          echo "=== Starting nginx ==="
          sudo chroot "${ROOTFS}" nginx -t || fail "nginx config error"
          sudo chroot "${ROOTFS}" nginx    || fail "nginx failed to start"

          echo "=== Waiting for backend (ARM64/QEMU, up to 10 min) ==="
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8000/health/ 2>/dev/null) || true
            if echo "$code" | grep -qE "^[234]"; then
              echo "Backend ready after $((i * 5))s"
              break
            fi
            [ "$i" -eq 120 ] && fail "Backend never became ready in 10 min"
            sleep 5
          done

          CURTAIN=$(curl -sfk --resolve "curtain.local:443:127.0.0.1" https://curtain.local/) \
            || fail "curtain.local vhost did not return 200"
          CURTAINPTM=$(curl -sfk --resolve "curtainptm.local:443:127.0.0.1" https://curtainptm.local/) \
            || fail "curtainptm.local vhost did not return 200"
          echo "$CURTAIN" | grep -q "<title>Curtain 2.0</title>" \
            || fail "curtain.local wrong title"
          echo "$CURTAINPTM" | grep -q "<title>CurtainPTM</title>" \
            || fail "curtainptm.local wrong title"
          echo "PASS: nginx vhost routing correct for both frontends"

      - name: Upload RPi image
        uses: actions/upload-artifact@v4
        with:
          name: curtain-pi-arm64
          path: pi-gen/deploy/*.img.xz
          retention-days: 30
          compression-level: 0

  summary:
    name: Summary
    needs: [build-frontend, build-vm, build-rpi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Curtain Appliance Images" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontends | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VM (amd64) | ${{ needs.build-vm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RPi (arm64) | ${{ needs.build-rpi.result }} |" >> $GITHUB_STEP_SUMMARY
